<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f6f7">
  <meta name="description" content="Aprenda fundamentos de redes jogando. Defenda a Cyber Rota em desafios de Segurança, Aplicação, Transporte, Rede e Física & Enlace.">
  <title>Cyber Rota — Defenda a Rede</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="board.css">
  <link rel="stylesheet" href="light-theme.css?v=11">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" aria-label="Navegação principal">
      <a class="brand" href="#inicio" data-page="home" aria-label="Cyber Rota, início">
        <span class="brand-mark" aria-hidden="true"><b>CR</b></span>
        <span><strong>Cyber Rota</strong><small>Jogo de redes</small></span>
      </a>
      <div class="side-label">Menu</div>
      <nav class="main-nav">
        <button class="nav-item active" data-page="home"><span class="nav-icon"><svg class="ui-icon"><use href="#icon-home"/></svg></span> Painel</button>
        <button class="nav-item" data-page="play"><span class="nav-icon"><svg class="ui-icon"><use href="#icon-play"/></svg></span> Nova partida</button>
        <button class="nav-item" data-page="stats"><span class="nav-icon"><svg class="ui-icon"><use href="#icon-chart"/></svg></span> Meu progresso</button>
        <button class="nav-item" data-page="errors"><span class="nav-icon"><svg class="ui-icon"><use href="#icon-rotate"/></svg></span> Caderno de erros <span class="nav-count" id="error-count">0</span></button>
      </nav>
      <div class="side-label side-label-lower">Recursos</div>
      <nav class="main-nav">
        <button class="nav-item" data-page="decks"><span class="nav-icon"><svg class="ui-icon"><use href="#icon-cards"/></svg></span> Baralhos & salas</button>
        <button class="nav-item" data-page="print"><span class="nav-icon"><svg class="ui-icon"><use href="#icon-printer"/></svg></span> Versão impressa</button>
      </nav>
      <div class="sidebar-bottom">
        <div class="sync-card"><span class="sync-dot"></span><div><b>Progresso neste dispositivo</b><small>Salvo automaticamente</small></div><span class="sync-check">✓</span></div>
        <button class="profile-button" id="profile-button"><span class="avatar">CR</span><span class="profile-copy"><b id="profile-name">Jogador convidado</b><small>Perfil local</small></span><span class="profile-more">···</span></button>
      </div>
    </aside>
    <div class="main-column">
      <header class="topbar">
        <div class="breadcrumb"><strong id="page-crumb">Painel</strong></div>
        <div class="top-actions"><button class="icon-button" id="help-button" aria-label="Ajuda" title="Ajuda"><svg class="ui-icon"><use href="#icon-info"/></svg></button><button class="avatar mini-avatar" id="profile-shortcut" aria-label="Perfil">CR</button></div>
      </header>
      <main id="app" tabindex="-1"></main>
      <footer class="app-footer"><span>Cyber Rota · Aprenda redes jogando</span><span>Progresso salvo neste dispositivo</span></footer>
    </div>
  </div>
  <div id="modal-root"></div>
  <div id="toast-root" aria-live="polite" aria-atomic="true"></div>
  <svg class="icon-library" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="icon-home" viewBox="0 0 24 24"><path d="m3.5 10 8.5-7 8.5 7v10a1 1 0 0 1-1 1h-5.5v-6h-4v6H4.5a1 1 0 0 1-1-1z"/></symbol>
    <symbol id="icon-play" viewBox="0 0 24 24"><path d="M7 4.8v14.4L19 12z"/></symbol>
    <symbol id="icon-chart" viewBox="0 0 24 24"><path d="M4 19.5h16M6.5 16V11m5.5 5V5m5.5 11v-7"/></symbol>
    <symbol id="icon-rotate" viewBox="0 0 24 24"><path d="M20 7v5h-5M4 17v-5h5"/><path d="M5.6 9a7.3 7.3 0 0 1 12.2-2L20 12M4 12l2.2 5a7.3 7.3 0 0 0 12.2-2"/></symbol>
    <symbol id="icon-cards" viewBox="0 0 24 24"><rect x="6" y="4" width="13" height="16" rx="2"/><path d="M9 8h7M9 12h7M9 16h4"/><path d="M4 7v13a2 2 0 0 0 2 2h10"/></symbol>
    <symbol id="icon-printer" viewBox="0 0 24 24"><path d="M7 8V3.5h10V8M7 17H5a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><path d="M7 14h10v7H7zM17.5 11.5h.01"/></symbol>
    <symbol id="icon-activity" viewBox="0 0 24 24"><path d="M3 12h4l3-7 4 14 3-7h4"/></symbol>
    <symbol id="icon-gauge" viewBox="0 0 24 24"><path d="M4.5 18a9 9 0 1 1 15 0M12 13l4-4M7 18h10"/></symbol>
    <symbol id="icon-award" viewBox="0 0 24 24"><circle cx="12" cy="8" r="5"/><path d="m8.5 12-1 9 4.5-2.5 4.5 2.5-1-9"/></symbol>
    <symbol id="icon-layers" viewBox="0 0 24 24"><path d="m12 3 9 5-9 5-9-5zM3 12l9 5 9-5M3 16l9 5 9-5"/></symbol>
    <symbol id="icon-target" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r=".8"/></symbol>
    <symbol id="icon-users" viewBox="0 0 24 24"><path d="M16 20v-1.5a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4V20M9.5 11a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7ZM17 4.3a3.5 3.5 0 0 1 0 6.8M17 14.5h.5a4 4 0 0 1 4 4V20"/></symbol>
    <symbol id="icon-shield" viewBox="0 0 24 24"><path d="M12 3 20 6v5c0 5.1-3.4 8.4-8 10-4.6-1.6-8-4.9-8-10V6z"/><path d="m8.5 12 2.2 2.2 4.8-5"/></symbol>
    <symbol id="icon-volume" viewBox="0 0 24 24"><path d="M4 10v4h4l5 4V6l-5 4zM16 9a4 4 0 0 1 0 6M18.5 6.5a7.5 7.5 0 0 1 0 11"/></symbol>
    <symbol id="icon-volume-off" viewBox="0 0 24 24"><path d="M4 10v4h4l5 4V6l-5 4zM17 9l5 6M22 9l-5 6"/></symbol>
    <symbol id="icon-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></symbol>
    <symbol id="icon-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  </svg>
  <script src="game-core.js"></script>
  <script src="app.js?v=10"></script>
</body>
</html>
